trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: CI
  displayName: "Integración Continua"
  jobs:
  - job: BuildAndTest
    steps:
    - script: npm ci
      displayName: "Instalar dependencias"

    - script: npm test
      displayName: "Ejecutar pruebas"

    - script: npm run build
      displayName: "Construir aplicación"

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: 'app-dist'
        publishLocation: 'Container'
      displayName: "Publicar artefacto dist/"

- stage: DEV
  displayName: "Deploy DEV"
  dependsOn: CI
  condition: succeeded()
  jobs:
  - deployment: DeployDEV
    environment: 'DEV'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'app-dist'
              downloadPath: '$(System.ArtifactsDirectory)'
            displayName: "Descargar artefacto"

          - script: |
              grep -rl "__ENV_PLACEHOLDER__" $(System.ArtifactsDirectory)/app-dist/assets/*.js | \
              xargs sed -i 's/__ENV_PLACEHOLDER__/DEV/g'
            displayName: "Reemplazar marcador de ambiente por DEV"

          - task: AzureStaticWebApp@0
            inputs:
              cwd: '$(System.ArtifactsDirectory)/app-dist'
              app_location: '/'
              skip_app_build: true
              azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
            displayName: "Desplegar a Azure Static Web Apps"

- stage: QA
  displayName: "Deploy QA"
  dependsOn: DEV
  condition: succeeded()
  jobs:
  - deployment: DeployQA
    environment: 'QA'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'app-dist'
              downloadPath: '$(System.ArtifactsDirectory)'
            displayName: "Descargar artefacto"

          - script: |
              grep -rl "__ENV_PLACEHOLDER__" $(System.ArtifactsDirectory)/app-dist/assets/*.js | \
              xargs sed -i 's/__ENV_PLACEHOLDER__/QA/g'
            displayName: "Reemplazar marcador de ambiente por QA"

          - task: AzureStaticWebApp@0
            inputs:
              cwd: '$(System.ArtifactsDirectory)/app-dist'
              app_location: '/'
              skip_app_build: true
              azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN_QA)'
            displayName: "Desplegar a Azure Static Web Apps QA"

- stage: PDN
  displayName: "Deploy PDN"
  dependsOn: QA
  condition: succeeded()
  jobs:
  - deployment: DeployPDN
    environment: 'PDN'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'app-dist'
              downloadPath: '$(System.ArtifactsDirectory)'
            displayName: "Descargar artefacto"

          - script: |
              grep -rl "__ENV_PLACEHOLDER__" $(System.ArtifactsDirectory)/app-dist/assets/*.js | \
              xargs sed -i 's/__ENV_PLACEHOLDER__/PDN/g'
            displayName: "Reemplazar marcador de ambiente por PDN"

          - task: AzureStaticWebApp@0
            inputs:
              cwd: '$(System.ArtifactsDirectory)/app-dist'
              app_location: '/'
              skip_app_build: true
              azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN_PDN)'
            displayName: "Desplegar a Azure Static Web Apps PDN"