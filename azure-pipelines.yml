trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: CI
  displayName: "Integración Continua"
  jobs:
  - job: BuildAndTest
    steps:
    - script: npm ci
      displayName: "Instalar dependencias"

    - script: npm test
      displayName: "Ejecutar pruebas"

    - script: npm run build
      displayName: "Construir aplicación"

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: 'app-dist'
        publishLocation: 'Container'
      displayName: "Publicar artefacto dist/"

- stage: DEV
  displayName: "Deploy DEV"
  dependsOn: CI
  condition: succeeded()
  jobs:
  - job: DeployDEV
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'app-dist'
        downloadPath: '$(System.ArtifactsDirectory)'
      displayName: "Descargar artefacto"

    - task: AzureStaticWebApp@0
      inputs:
        cwd: '$(System.ArtifactsDirectory)/app-dist'
        app_location: '/'
        skip_app_build: true
        azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
      displayName: "Desplegar a Azure Static Web Apps"